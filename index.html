<!doctype html>
<html lang="en">
    <head>
        <!-- Title -->
        <title>TaskNest | Modern To-Do List</title>

        <!-- SEO -->
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="TaskNest is a modern task management application that helps you organize, track, and manage daily tasks with search, filters, reminders, dark mode, and persistent storage."
        />
        <meta name="author" content="Omar Allam" />
        <meta
            name="keywords"
            content="TaskNest, to-do list, task manager, productivity, task management, reminder, local storage, cookies, session storage, HTML, CSS, JavaScript, Bootstrap"
        />
        <meta name="robots" content="index, follow" />

        <!-- Favicon -->
        <link rel="icon" href="assets/images/logo.png" />

        <!-- Icons & CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="assets/css/style.css" />

        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta property="og:title" content="TaskNest | Modern To-Do List" />
        <meta
            property="og:description"
            content="Stay organized with TaskNest — a modern task management application featuring task reminders, search, filters, dark mode, and persistent storage."
        />
        <meta property="og:image" content="https://omarallamdev.github.io/tasknest/assets/images/og-image.png" />
        <meta property="og:url" content="https://omarallamdev.github.io/tasknest/" />
        <meta property="og:site_name" content="TaskNest" />

        <!-- Canonical -->
        <link rel="canonical" href="https://omarallamdev.github.io/tasknest/" />
    </head>
    <body>
        <!-- #region NavBar -->
        <nav id="nav" class="d-flex flex-row justify-content-between align-items-center">
            <div class="d-flex flex-row justify-content-center align-items-center">
                <img src="assets/images/logo.png" alt="Logo" id="nav-logo" />
                <h2 id="nav-title">Task<span>Nest</span></h2>
                <p id="nav-divider"></p>
                <p id="nav-text">Organize, Prioritize, Achieve.</p>
            </div>

            <div>
                <button id="theme-btn">.</button>
            </div>
        </nav>
        <!-- #endregion -->

        <!-- #region Hero & Statistics -->
        <section id="header">
            <div>
                <h1 id="header-title">Good morning! 👋</h1>
                <p id="header-text">Stay organized and get more done today.</p>
            </div>

            <div id="header-grid">
                <div class="header-card d-flex flex-row align-items-center gap-2">
                    <div class="header-icons header-icon-blue bi bi-list-check d-flex align-items-center justify-content-center"></div>
                    <div>
                        <p>Total Tasks</p>
                        <h2 id="total-tasks"></h2>
                    </div>
                </div>
                <div class="header-card d-flex flex-row align-items-center gap-2">
                    <div class="header-icon-orange header-icons bi bi-clock d-flex align-items-center justify-content-center"></div>
                    <div>
                        <p>Pending</p>
                        <h2 id="pending-tasks"></h2>
                    </div>
                </div>
                <div class="header-card d-flex flex-row align-items-center gap-2">
                    <div class="header-icon-blue header-icons bi bi-arrow-repeat d-flex align-items-center justify-content-center"></div>
                    <div>
                        <p>In Progress</p>
                        <h2 id="in-progress-tasks"></h2>
                    </div>
                </div>
                <div class="header-card d-flex flex-row align-items-center gap-2">
                    <div class="header-icon-green header-icons bi bi-check-circle d-flex align-items-center justify-content-center"></div>
                    <div>
                        <p>Completed</p>
                        <h2 id="completed-tasks"></h2>
                    </div>
                </div>
            </div>
        </section>
        <!-- #endregion -->

        <!-- #region Activity Messages -->
        <section id="message-section" class="dsp-none">
            <div id="message-box">
                <p><i class="bi bi-bell"></i> <span id="activity-msg"></span></p>
            </div>
        </section>
        <!-- #endregion -------------------->

        <!-- #region Add Form & Task List -->
        <section id="form-and-list" class="d-flex flex-row gap-3">
            <!-- Add Form -->
            <section id="add-form" class="d-flex flex-column gap-2">
                <label for="task-title">Task Title <span>*</span></label>
                <input type="text" id="task-title" placeholder="e.g. Buy my needs" />

                <label for="task-desc">Description</label>
                <textarea id="task-desc" placeholder="Add task description..."></textarea>

                <label for="task-date">Due Date <span>*</span></label>
                <input type="date" id="task-date" />

                <div class="d-flex flex-row justify-content-between gap-3">
                    <div class="d-flex flex-column gap-2">
                        <label for="task-priority">Priority</label>
                        <select id="task-priority">
                            <option value="high">🔴 High</option>
                            <option value="med">🟡 Medium</option>
                            <option value="low">🟢 Low</option>
                        </select>
                    </div>
                    <div class="d-flex flex-column gap-2">
                        <label for="task-status">Status</label>
                        <select id="task-status">
                            <option value="pending">⚪ Pending</option>
                            <option value="in-progress">🔵 In Progress</option>
                            <option value="completed">🟢 Completed</option>
                        </select>
                    </div>
                </div>

                <p id="error-msg"></p>

                <button id="add-button"><i class="bi bi-plus-circle"></i> Add Task</button>
            </section>

            <!-- Task List -->
            <main id="task-list">
                <div id="search-and-filter" class="d-flex flex-row align-items-center gap-3">
                    <div id="search-box" class="flex-grow-1 flex-shrink-0">
                        <i class="bi bi-search"></i>
                        <input type="text" id="search" placeholder="Search tasks..." />
                    </div>
                    <div class="d-flex flex-row align-items-center gap-3">
                        <select title="Filter tasks by priority" id="filter-priority">
                            <option value="all">All Priorities</option>
                            <option value="high">High</option>
                            <option value="med">Medium</option>
                            <option value="low">Low</option>
                        </select>
                        <select title="Filter tasks by status" id="filter-status">
                            <option value="all">All Statuses</option>
                            <option value="pending">Pending</option>
                            <option value="in-progress">In Progress</option>
                            <option value="completed">Completed</option>
                        </select>
                        <button id="reset-button" class="flex-shrink-0"><i class="bi bi-arrow-counterclockwise"></i> Reset</button>
                    </div>
                </div>

                <div id="tasks-box"></div>
            </main>
        </section>
        <!-- #endregion -->

        <!-- #region Footer -->
        <footer>
            <p>&copy; 2026 TaskNest. All rights reserved.</p>
        </footer>
        <!-- #endregion -->

        <script src="assets/js/script.js"></script>
    </body>
</html>
